<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel de Mentores – Plataforma de Mentoría</title>
<style>
:root{--n:#17365d;--b:#2563eb;--bg:#f3f6fa;--line:#dbe3ed;--txt:#1e293b;--mut:#64748b;--g:#c6e0b4;--y:#ffe699;--r:#f4cccc}
*{box-sizing:border-box}body{margin:0;font-family:Arial,system-ui,sans-serif;background:var(--bg);color:var(--txt)}
header{background:var(--n);color:white;padding:18px 25px}header h1{margin:0;font-size:23px}header p{margin:5px 0 0;font-size:13px;opacity:.9}
.wrap{max-width:1550px;margin:auto;padding:18px}.bar{display:flex;gap:9px;margin-bottom:14px}.bar>*{height:40px}select,input{border:1px solid var(--line);border-radius:8px;padding:9px;background:#fff}select{width:220px}#search{flex:1}
button{border:0;border-radius:8px;padding:9px 14px;font-weight:bold;cursor:pointer}.primary{background:var(--n);color:white}.white{background:white;border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:310px 1fr;gap:14px}.panel{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden}.ph{padding:12px 14px;border-bottom:1px solid var(--line);font-weight:bold}.list{max-height:calc(100vh - 155px);overflow:auto}.stu{padding:11px 13px;border-bottom:1px solid #eef2f6;cursor:pointer}.stu:hover,.stu.active{background:#edf4ff}.name{font-weight:bold;font-size:14px}.meta{font-size:11px;color:var(--mut);margin-top:3px}.badge{display:inline-block;border-radius:15px;padding:3px 7px;font-size:10px;font-weight:bold;margin-left:5px}.g{background:var(--g)}.y{background:var(--y)}.r{background:var(--r)}.s{background:#e5e7eb}
.content{padding:17px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.top h2{margin:0 0 4px;font-size:21px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:15px 0}.stat{border:1px solid var(--line);border-radius:10px;padding:11px}.stat b{font-size:18px;display:block}.stat span{font-size:11px;color:var(--mut)}
.alerts{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.alert{border:1px solid var(--line);border-radius:10px;padding:11px}.alert b{display:block;margin-bottom:4px}.alert small{color:var(--mut)}
.formtop{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:9px;margin:14px 0}.field label{font-size:11px;color:var(--mut);font-weight:bold;display:block;margin-bottom:4px}.field input{width:100%}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}.card{border:1px solid var(--line);border-radius:10px;padding:11px}.card h3{font-size:13px;color:var(--n);margin:0 0 8px}.scores{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.scores button{background:#f8fafc;border:1px solid var(--line);padding:7px}.scores button.on{background:var(--n);color:#fff}.criteria{font-size:10px;color:var(--mut);line-height:1.35;margin-top:7px}.section{margin-top:14px}.section h3{font-size:14px;margin:0 0 8px}.notes{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.notes textarea{width:100%;min-height:75px;border:1px solid var(--line);border-radius:8px;padding:9px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.empty{text-align:center;padding:55px;color:var(--mut)}
@media(max-width:1000px){.grid{grid-template-columns:1fr}.list{max-height:280px}.cards,.alerts{grid-template-columns:repeat(2,1fr)}.formtop,.stats{grid-template-columns:1fr 1fr}}
@media(max-width:650px){.bar,.top{flex-direction:column;align-items:stretch}.cards,.alerts,.notes,.formtop,.stats{grid-template-columns:1fr}select{width:100%}}
</style></head>

function card(key,title,desc){let r=rec(current),v=r.scores[key];return `<div class="card"><h3>${title}</h3><div class="scores">${[0,1,2,3].map(x=>`<button class="${String(v)===String(x)?"on":""}" onclick="setScore('${key}',${x})">${x}</button>`).join("")}</div><div class="criteria">${desc}</div></div>`}
function renderStudent(){let s=current,r=rec(s),[sv,sk]=sem(r),t=total(r),at=attendance(s),bh=behavior(s),ac=academic(s);
main.innerHTML=`<div class="content"><div class="top"><div><h2>${esc(nm(s))}</h2><div style="font-size:12px;color:#64748b">${esc(s["Curso Estudiante"])} · ${esc(s["RUT Estudiante"]||"")}</div></div><span class="badge ${sk}" style="font-size:14px;padding:7px 12px">${sv}${t!==""?" · "+t+"/9":""}</span></div>
<div class="stats"><div class="stat"><b>${esc(at[0])}</b><span>Asistencia · 01–31 agosto</span></div><div class="stat"><b>${esc(ac[0])}</b><span>Promedio final</span></div><div class="stat"><b>${esc(bh[0])}</b><span>Comportamiento</span></div><div class="stat"><b>${esc(s["Pie Estudiante"]||"—")}</b><span>PIE</span></div></div>
<div class="section"><h3>🚦 Alertas automáticas</h3><div class="alerts"><div class="alert"><b>Asistencia <span class="badge ${at[1]}">${at[1]=="g"?"SIN ALERTA":at[1]=="y"?"ATENCIÓN":"ALERTA"}</span></b><small>${esc(at[0])}. Umbral configurable.</small></div><div class="alert"><b>Rendimiento <span class="badge ${ac[1]}">${ac[1]=="g"?"SIN ALERTA":ac[1]=="y"?"ATENCIÓN":"ALERTA"}</span></b><small>Promedio final: ${esc(ac[0])}</small></div><div class="alert"><b>Comportamiento <span class="badge ${bh[1]}">${bh[1]=="g"?"SIN ALERTA":bh[1]=="y"?"ATENCIÓN":"ALERTA"}</span></b><small>${esc(bh[0])}</small></div></div></div>
<div class="formtop"><div class="field"><label>MENTOR RESPONSABLE</label><input id="mentor" value="${esc(r.mentor)}" placeholder="Escribir mentor a cargo"></div><div class="field"><label>FECHA</label><input id="date" type="date" value="${esc(r.date)}"></div><div class="field"><label>SEGUIMIENTO</label><input id="follow" value="${esc(r.follow||"")}" placeholder="Semanal / quincenal / mensual"></div></div>
<div class="section"><h3>Evaluación INDEX del mentor</h3><div class="cards">
${card("t","Trayectoria Educativa","0: regular · 1: alertas leves · 2: dificultades reiteradas · 3: riesgo alto")}
${card("a","Ámbito Académico","0: sin alertas · 1: descenso leve · 2: descenso sostenido · 3: riesgo significativo")}
${card("c","Ámbito Conductual","0: sin observaciones · 1: ocasionales · 2: reiteradas · 3: afectan convivencia/aprendizaje")}
${card("se","Ámbito Socioemocional","0: ajuste adecuado · 1: señales leves · 2: persistentes · 3: alta vulnerabilidad")}</div></div>
<div class="section"><h3>Registro de evidencia</h3><div class="notes">${note("tray","Datos observados – Trayectoria")}${note("aca","Datos observados – Académico")}${note("con","Datos observados – Conductual")}${note("soc","Datos observados – Socioemocional")}${note("alerts","Hitos / Alertas")}${note("pat","Patrón que se repite en el tiempo")}${note("hip","Hipótesis")}${note("evi","Evidencia faltante / cómo recogerla")}</div></div>
<div class="section"><h3>Acción a corto plazo</h3><textarea id="accion" style="width:100%;min-height:70px;border:1px solid #dbe3ed;border-radius:8px;padding:9px">${esc(r.notes.accion||"")}</textarea></div>
<div class="actions"><span style="margin-right:auto;font-size:11px;color:#64748b;align-self:center">💾 La evaluación queda guardada en este equipo y se incluirá en el Excel del curso.</span><button class="white" onclick="clearS()">Limpiar</button><button class="primary" onclick="saveS()">Guardar evaluación</button></div>
<div class="section"><details><summary style="cursor:pointer;font-weight:bold">Ver información original de la planilla</summary><div class="notes" style="margin-top:9px">${COLS.map(k=>`<div class="alert"><b>${esc(k)}</b><small>${esc(s[k])}</small></div>`).join("")}</div></details></div>
</div>`}
function note(k,t){let v=rec(current).notes[k]||"";return `<div><label style="font-size:11px;font-weight:bold;color:#64748b">${t}</label><textarea id="n_${k}" style="width:100%;min-height:75px;border:1px solid #dbe3ed;border-radius:8px;padding:9px">${esc(v)}</textarea></div>`}
function persistCurrentEvaluation(){
  if(!current) return;
  let r=rec(current);
  const mentorEl=document.getElementById("mentor"), dateEl=document.getElementById("date"), followEl=document.getElementById("follow"), accionEl=document.getElementById("accion");
  if(mentorEl) r.mentor=mentorEl.value;
  if(dateEl) r.date=dateEl.value;
  if(followEl) r.follow=followEl.value;
  ["tray","aca","con","soc","alerts","pat","hip","evi"].forEach(k=>{let el=document.getElementById("n_"+k); if(el) r.notes[k]=el.value;});
  if(accionEl) r.notes.accion=accionEl.value;
  save();
}
function saveS(){persistCurrentEvaluation();renderList();renderStudent();alert("Evaluación guardada correctamente. Quedará incluida en el Excel del curso.")}
function clearS(){if(confirm("¿Limpiar la evaluación de este estudiante?")){delete data[id(current)];save();renderList();renderStudent()}}
function courseSummary(){let c=course.value,a=STUDENTS.filter(s=>String(s["Curso Estudiante"])===c),ct={VERDE:0,AMARILLO:0,ROJO:0,"SIN EVALUAR":0};a.forEach(s=>ct[sem(rec(s))[0]]++);main.innerHTML=`<div class="content"><h2>Resumen · ${esc(c)}</h2><div class="stats">${Object.entries(ct).map(([k,v])=>`<div class="stat ${k=="VERDE"?"g":k=="AMARILLO"?"y":k=="ROJO"?"r":"s"}"><b>${v}</b><span>${k}</span></div>`).join("")}</div><p style="color:#64748b;font-size:12px">Total: ${a.length} estudiantes. Las alertas automáticas son señales orientativas; la evaluación INDEX final corresponde al criterio del mentor.</p></div>`}
function download(){
  // Guarda automáticamente la evaluación que esté abierta antes de crear el Excel.
  // Así, incluso si el mentor escribió cambios y fue directo a descargar, quedan incluidos.
  persistCurrentEvaluation();
  let c=course.value;
  let students=STUDENTS.filter(s=>String(s["Curso Estudiante"])===String(c));
  let extra=["Mentor Responsable","Trayectoria (0-3)","Académico (0-3)","Conductual (0-3)","Socioemocional (0-3)","Total","Semáforo","Fecha evaluación","Seguimiento","Datos observados - Trayectoria","Datos observados - Académico","Datos observados - Conductual","Datos observados - Socioemocional","Hitos / Alertas","Patrón observado","Hipótesis","Evidencia faltante / cómo recogerla","Acción a corto plazo"];
  let headers=[...COLS,...extra];
  let rows=students.map(s=>{
    let r=rec(s),t=total(r),sv=sem(r)[0];
    return [...COLS.map(k=>s[k]),r.mentor,r.scores.t,r.scores.a,r.scores.c,r.scores.se,t,sv,r.date,r.follow,r.notes.tray||"",r.notes.aca||"",r.notes.con||"",r.notes.soc||"",r.notes.alerts||"",r.notes.pat||"",r.notes.hip||"",r.notes.evi||"",r.notes.accion||""];
  });
  const h=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const semIndex=headers.indexOf("Semáforo");
  const wrapStart=headers.indexOf("Datos observados - Trayectoria");
  let tableRows=rows.map(row=>`<tr>${row.map((v,i)=>{
    let style="border:1px solid #b8c4d1;padding:7px;vertical-align:top;";
    if(i>=wrapStart) style+="white-space:normal;mso-wrap-text:yes;min-width:220px;";
    if(i===semIndex){
      let sv=String(v||"").toUpperCase();
      if(sv==="ROJO") style+="background:#f4cccc;color:#990000;font-weight:bold;text-align:center;";
      else if(sv==="AMARILLO") style+="background:#fff2cc;color:#7f6000;font-weight:bold;text-align:center;";
      else if(sv==="VERDE") style+="background:#d9ead3;color:#274e13;font-weight:bold;text-align:center;";
      else style+="background:#eeeeee;font-weight:bold;text-align:center;";
    }
    return `<td style="${style}">${h(v)}</td>`;
  }).join("")}</tr>`).join("");
  let html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
    table{border-collapse:collapse;font-family:Arial,sans-serif;font-size:10pt}
    th{background:#17365d;color:#fff;border:1px solid #9aa9b8;padding:8px;font-weight:bold;text-align:center;white-space:normal}
    td{mso-number-format:"\\@"}
  </style></head><body>
    <h2 style="font-family:Arial;color:#17365d">Panel de Mentores - ${h(c)}</h2>
    <p style="font-family:Arial;font-size:10pt">Evaluaciones del curso seleccionado. El semáforo corresponde al resultado registrado en la plataforma.</p>
    <table><thead><tr>${headers.map(x=>`<th>${h(x)}</th>`).join("")}</tr></thead><tbody>${tableRows}</tbody></table>
  </body></html>`;
  let blob=new Blob(["\ufeff",html],{type:"application/vnd.ms-excel;charset=utf-8"});
  let a=document.createElement("a");
  let url=URL.createObjectURL(blob);
  a.href=url;
  a.download="Panel_Mentores_"+String(c).replace(/[^a-zA-Z0-9ÁÉÍÓÚáéíóúÑñ]+/g,"_")+"_2026.xls";
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
course.innerHTML=COURSES.map(x=>`<option>${esc(x)}</option>`).join("");course.onchange=()=>{current=null;renderList();main.innerHTML='<div class="empty">Selecciona un estudiante.</div>'};search.oninput=renderList;renderList();
</script></body></html>
